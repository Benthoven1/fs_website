  <link rel="stylesheet" href="reels.css" />
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.161.0/build/three.module.min.js" } }

<body>
  <!-- Drawn at 1080 × 1920 and scaled to the window. Layers, bottom to top:
       the cosmos, the collage, paper over the cosmos, the hero's words, the
       wordmark, black for the cut in and out, then the lens. -->
  <div id="stage" aria-hidden="true">
    <canvas id="gl"></canvas>
    <canvas id="collage"></canvas>
    <div id="veil"></div>
    <div id="captions"></div>
    <div id="brand">
      <div class="mark"></div>
      <div class="cta"><span class="pill">Join the waitlist</span><span class="url">mulvium.org</span></div>
    </div>
    <div id="black"></div>
    <canvas id="grain"></canvas>
    <div id="vignette"></div>
  </div>

  <button id="play" type="button" hidden>
    <span class="play-mark" aria-hidden="true"></span>
    <span class="play-label">Play the reel</span>
    <span class="play-note">Sound on</span>
  </button>
  <audio id="score" preload="none"></audio>

  <script type="module" src="reel.js"></script>
</body>
</html>
