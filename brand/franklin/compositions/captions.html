  <div id="root" data-composition-id="captions" data-width="1080" data-height="1920">
<div id="captions-g0" class="cap"><span>In 1731, Philadelphia had no lending</span></div>
<div id="captions-g1" class="cap"><span>library.</span></div>
<div id="captions-g2" class="cap"><span>No fire company.</span></div>
<div id="captions-g3" class="cap"><span>No hospital.</span></div>
<div id="captions-g4" class="cap"><span>No college.</span></div>
<div id="captions-g5" class="cap"><span>Twenty years later,</span></div>
<div id="captions-g6" class="cap"><span>it had all four,</span></div>
<div id="captions-g7" class="cap"><span>and one man had helped to</span></div>
<div id="captions-g8" class="cap"><span>start every one of them.</span></div>
<div id="captions-g9" class="cap"><span>Benjamin Franklin:</span></div>
<div id="captions-g10" class="cap"><span>printer,</span></div>
<div id="captions-g11" class="cap"><span>writer,</span></div>
<div id="captions-g12" class="cap"><span>scientist,</span></div>
<div id="captions-g13" class="cap"><span>inventor.</span></div>
<div id="captions-g14" class="cap"><span>And in time,</span></div>
<div id="captions-g15" class="cap"><span>a Founding Father,</span></div>
<div id="captions-g16" class="cap"><span>who signed both the Declaration of</span></div>
<div id="captions-g17" class="cap"><span>Independence and the Constitution.</span></div>
<div id="captions-g18" class="cap"><span>A polymath, pointed at the public</span></div>
<div id="captions-g19" class="cap"><span>good.</span></div>
<div id="captions-g20" class="cap"><span>It began with the Junto:</span></div>
<div id="captions-g21" class="cap"><span>a club of young tradesmen he</span></div>
<div id="captions-g22" class="cap"><span>gathered in 1727,</span></div>
<div id="captions-g23" class="cap"><span>to read,</span></div>
<div id="captions-g24" class="cap"><span>debate,</span></div>
<div id="captions-g25" class="cap"><span>and improve themselves.</span></div>
<div id="captions-g26" class="cap"><span>First,</span></div>
<div id="captions-g27" class="cap"><span>they pooled their own books.</span></div>
<div id="captions-g28" class="cap"><span>Then,</span></div>
<div id="captions-g29" class="cap"><span>in 1731, Franklin persuaded fifty subscribers</span></div>
<div id="captions-g30" class="cap"><span>to pay forty shillings each,</span></div>
<div id="captions-g31" class="cap"><span>and buy books together.</span></div>
<div id="captions-g32" class="cap"><span>The Library Company of Philadelphia</span></div>
<div id="captions-g33" class="cap"><span>is still open today:</span></div>
<div id="captions-g34" class="cap"><span>America's oldest cultural institution.</span></div>
<div id="captions-g35" class="cap"><span>Fire was the next problem.</span></div>
<div id="captions-g36" class="cap"><span>After warning that an ounce of</span></div>
<div id="captions-g37" class="cap"><span>prevention is worth a pound of</span></div>
<div id="captions-g38" class="cap"><span>cure,</span></div>
<div id="captions-g39" class="cap"><span>he organised the Union Fire Company:</span></div>
<div id="captions-g40" class="cap"><span>volunteers pledged to fight fires with</span></div>
<div id="captions-g41" class="cap"><span>their own leather buckets.</span></div>
<div id="captions-g42" class="cap"><span>When Dr Thomas Bond wanted a</span></div>
<div id="captions-g43" class="cap"><span>hospital for the sick poor,</span></div>
<div id="captions-g44" class="cap"><span>Franklin found a clever way to</span></div>
<div id="captions-g45" class="cap"><span>fund it.</span></div>
<div id="captions-g46" class="cap"><span>The Assembly would give two thousand</span></div>
<div id="captions-g47" class="cap"><span>pounds,</span></div>
<div id="captions-g48" class="cap"><span>but only if private donors raised</span></div>
<div id="captions-g49" class="cap"><span>two thousand first.</span></div>
<div id="captions-g50" class="cap"><span>It was one of America's first</span></div>
<div id="captions-g51" class="cap"><span>matching grants.</span></div>
<div id="captions-g52" class="cap"><span>Then came an academy,</span></div>
<div id="captions-g53" class="cap"><span>which grew into the University of</span></div>
<div id="captions-g54" class="cap"><span>Pennsylvania.</span></div>
<div id="captions-g55" class="cap"><span>But here is the thing.</span></div>
<div id="captions-g56" class="cap"><span>Each one had to be built</span></div>
<div id="captions-g57" class="cap"><span>from scratch:</span></div>
<div id="captions-g58" class="cap"><span>the agreements,</span></div>
<div id="captions-g59" class="cap"><span>the subscriptions,</span></div>
<div id="captions-g60" class="cap"><span>the fundraising,</span></div>
<div id="captions-g61" class="cap"><span>the books.</span></div>
<div id="captions-g62" class="cap"><span>Franklin did it four times,</span></div>
<div id="captions-g63" class="cap"><span>alongside a printing business,</span></div>
<div id="captions-g64" class="cap"><span>an almanac,</span></div>
<div id="captions-g65" class="cap"><span>and experiments with lightning.</span></div>
<div id="captions-g66" class="cap"><span>Today, a founder like Franklin would</span></div>
<div id="captions-g67" class="cap"><span>not have to start from zero.</span></div>
<div id="captions-g68" class="cap"><span>A fiscal sponsor gives a new</span></div>
<div id="captions-g69" class="cap"><span>project a legal and financial home</span></div>
<div id="captions-g70" class="cap"><span>from day one:</span></div>
<div id="captions-g71" class="cap"><span>it can accept gifts,</span></div>
<div id="captions-g72" class="cap"><span>win grants</span></div>
<div id="captions-g73" class="cap"><span>and sign contracts,</span></div>
<div id="captions-g74" class="cap"><span>while the founder does the work.</span></div>
